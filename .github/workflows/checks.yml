name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r api/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test web/tests/flows.test.cjs
      - run: bash -n vm/bootstrap.sh
      - run: az bicep install && az bicep build --file infra/main.bicep --stdout > /dev/null
      - shell: pwsh
        run: |
          $errorsFound = @()
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$parseErrors)
            $errorsFound += $parseErrors
          }
          if ($errorsFound.Count) { $errorsFound | Format-List; exit 1 }
